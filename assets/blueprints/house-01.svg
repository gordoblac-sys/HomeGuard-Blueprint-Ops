  <text x="835" y="205" text-anchor="middle">LIVING ROOM</text>
  <text x="430" y="330" text-anchor="middle">KITCHEN</text>
  <text x="610" y="458" text-anchor="middle">BACK ENTRY</text>
  <text x="805" y="458" text-anchor="middle">HALLWAY</text>
  <text x="1030" y="458" text-anchor="middle">BATHROOM</text>
  <text x="430" y="555" text-anchor="middle">LAUNDRY</text>
  <text x="430" y="675" text-anchor="middle">UTILITY</text>
  <text x="610" y="575" text-anchor="middle">STAIRS</text>
  <text x="915" y="565" text-anchor="middle">BEDROOM</text>
</g>

<!-- property labels -->
<g fill="#b8d8c0" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2" opacity=".8">
  <text x="700" y="118" text-anchor="middle">FRONT YARD</text>
  <text x="120" y="470" text-anchor="middle" transform="rotate(-90 120 470)">LEFT SIDE YARD</text>
  <text x="1295" y="540" text-anchor="middle" transform="rotate(90 1295 540)">RIGHT SIDE YARD</text>
  <text x="650" y="858" text-anchor="middle">BACKYARD</text>
</g>

<!-- risk source symbols -->
<g font-family="Arial" font-size="18" font-weight="700">
  <circle cx="375" cy="335" r="14" fill="#ff6f5e"/><text x="375" y="341" fill="white" text-anchor="middle">F</text>
  <circle cx="390" cy="690" r="14" fill="#36bfff"/><text x="390" y="696" fill="white" text-anchor="middle">W</text>
  <circle cx="466" cy="570" r="14" fill="#36bfff"/><text x="466" y="576" fill="white" text-anchor="middle">W</text>
  <circle cx="610" cy="620" r="14" fill="#c783ff"/><text x="610" y="626" fill="white" text-anchor="middle">!</text>
</g>

<text x="42" y="862" fill="#8fb5c6" font-family="Arial" font-size="13" letter-spacing="2">PROPERTY PLAN • LEVEL 01 • CLICK HIGHLIGHTED ZONES TO ENTER INSTALLATION VIEW</text>
</svg>