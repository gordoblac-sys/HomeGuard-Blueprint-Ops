    <line x1="1155" y1="225" x2="1155" y2="315"/><line x1="1155" y1="600" x2="1155" y2="685"/>
    <line x1="320" y1="350" x2="320" y2="430"/><line x1="770" y1="760" x2="865" y2="760"/><line x1="955" y1="760" x2="1050" y2="760"/>
  </g>

