  <rect x="545" y="535" width="135" height="210" fill="#e1e8ec"/>
  <rect x="695" y="535" width="440" height="210" fill="#e6ecef"/>

  <!-- walls -->
  <g stroke="#203743" stroke-width="9" stroke-linecap="square">
