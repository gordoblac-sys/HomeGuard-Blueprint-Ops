  </g>

  <!-- stairs -->
  <g stroke="#6f858f" stroke-width="3"><line x1="570" y1="555" x2="650" y2="555"/><line x1="570" y1="580" x2="650" y2="580"/><line x1="570" y1="605" x2="650" y2="605"/><line x1="570" y1="630" x2="650" y2="630"/><line x1="570" y1="655" x2="650" y2="655"/><line x1="570" y1="680" x2="650" y2="680"/><line x1="570" y1="705" x2="650" y2="705"/></g>
