<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" fill="none">
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#5abde5" stroke-width="1" opacity=".09"/></pattern>
  <pattern id="grass" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M5 27l5-8m10 10l3-10m7 5l-4-7" stroke="#6b956f" stroke-width="1.4" opacity=".22"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect width="1400" height="900" fill="#07131d"/>
<rect x="18" y="18" width="1364" height="864" rx="28" fill="#193826" stroke="#4f8c68" stroke-width="3"/>
<rect x="18" y="18" width="1364" height="864" rx="28" fill="url(#grass)"/>
<rect width="1400" height="900" fill="url(#grid)"/>

<!-- street / curb / driveway -->
<rect x="0" y="0" width="1400" height="82" fill="#202c35"/>
<line x1="0" y1="65" x2="1400" y2="65" stroke="#d5dde3" stroke-width="4" stroke-dasharray="42 28" opacity=".55"/>
