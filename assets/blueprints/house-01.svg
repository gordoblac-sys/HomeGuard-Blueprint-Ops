<path d="M1178 397v178" stroke="#69747b" stroke-width="120" opacity=".85"/>
<text x="1175" y="118" fill="#b9c6cf" font-size="18" font-family="Arial" text-anchor="middle" letter-spacing="3">DRIVEWAY</text>

<!-- walkway -->
<path d="M540 82v105" stroke="#b9b5a8" stroke-width="58"/>
<path d="M540 187h-45" stroke="#b9b5a8" stroke-width="58"/>

