<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#faf7f2"/>
<stop offset="1" stop-color="#e7ded1"/>
</linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#b79b7e"/>
<stop offset="1" stop-color="#80654d"/>
</linearGradient>
</defs>

<rect width="1280" height="440" fill="url(#wall)"/>
<rect y="440" width="1280" height="280" fill="url(#floor)"/>

<!-- upper cabinets -->
<g fill="#d6d9da" stroke="#a7b0b5" stroke-width="3">
<rect x="70" y="110" width="180" height="210" rx="8"/>
<rect x="260" y="110" width="180" height="210" rx="8"/>
<rect x="835" y="110" width="170" height="210" rx="8"/>
<rect x="1015" y="110" width="170" height="210" rx="8"/>
</g>

<!-- fridge -->
<rect x="465" y="110" width="180" height="330" rx="12"
fill="#aeb9bf" stroke="#8e999f" stroke-width="4"/>
<line x1="555" y1="115" x2="555" y2="435"
stroke="#8c969c" stroke-width="3"/>
<rect x="530" y="225" width="10" height="85" rx="5" fill="#66737b"/>
<rect x="570" y="225" width="10" height="85" rx="5" fill="#66737b"/>

<!-- lower cabinets -->
<rect x="70" y="355" width="1115" height="210"
fill="#8e9aa1"/>
<rect x="70" y="335" width="1115" height="35"
fill="#d8d0c4"/>

<!-- stove -->
<rect x="685" y="345" width="145" height="220"
fill="#2d3138"/>
<rect x="700" y="362" width="115" height="66"
fill="#171a1e"/>
<g fill="#646b70">
<circle cx="720" cy="385" r="13"/>
<circle cx="790" cy="385" r="13"/>
<circle cx="720" cy="414" r="13"/>
<circle cx="790" cy="414" r="13"/>
</g>

<!-- sink -->
<rect x="930" y="345" width="185" height="65" rx="10"
fill="#c8d0d4"/>
<ellipse cx="1020" cy="378" rx="66" ry="22"
fill="#8eabb7"/>
<path d="M1020 352v-34q0-35 32-35"
fill="none" stroke="#808c91" stroke-width="8"/>

<!-- island -->
<rect x="390" y="500" width="360" height="145" rx="18"
fill="#e1dad0" stroke="#b9ad9f" stroke-width="3"/>
<rect x="360" y="475" width="420" height="42" rx="12"
fill="#d2c9bc"/>

<!-- window -->
<rect x="895" y="95" width="235" height="190" rx="10"
fill="#cfeaf7" stroke="#b4ccd8" stroke-width="7"/>
<line x1="1012" y1="100" x2="1012" y2="280"
stroke="#b4ccd8" stroke-width="5"/>
<line x1="900" y1="190" x2="1125" y2="190"
stroke="#b4ccd8" stroke-width="5"/>

<!-- ceiling smoke position hint -->
<circle cx="650" cy="45" r="25" fill="#eef2f4"
stroke="#c5cdd2" stroke-width="5"/>

<text x="80" y="680" font-size="26" font-family="Arial"
fill="#453c36" font-weight="700">
CABINETS • COUNTERS • REFRIGERATOR • STOVE • SINK • WATER / FIRE RISK
</text>
</svg>